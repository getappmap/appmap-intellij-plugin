name: Publish
env:
    # See the note in build.yml: keeps Yarn's zip cache at a path that is stable across runners.
    YARN_ENABLE_GLOBAL_CACHE: "false"
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to publish (e.g. v0.83.1)"
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: Marketplace Deployment
        steps:
            - name: Fetch Sources
              uses: actions/checkout@v6
              with:
                  # Force refs/tags/ prefix so that a branch name or non-existent value
                  # causes checkout to fail rather than silently publishing from wrong code.
                  ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: jetbrains
                  java-version: 21

            # buildPlugin bundles the webviews from source, which needs Node (Yarn is vendored).
            # Version comes from .nvmrc, shared with build.yml, so the published artifact is built
            # on the same Node the Build workflow tested.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Cache webview dependencies
              uses: actions/cache@v5
              with:
                  path: appland-webview/.yarn/cache
                  key: yarn-${{ runner.os }}-${{ hashFiles('appland-webview/yarn.lock') }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Publish Plugin
              shell: bash
              env:
                  JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
              run: ./gradlew clean buildPlugin publishPlugin -x test -x testAgent
